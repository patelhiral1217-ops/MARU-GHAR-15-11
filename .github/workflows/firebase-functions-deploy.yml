name: Maru Ghar Firebase Functions and Rules Deploy
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT repository secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Firestore rules only
        uses: w9jds/firebase-action@v13.29.0
        with:
          args: deploy --only firestore:rules --project maru-ghar-gandhinagar-8dbe4
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

  deploy-cloud-functions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        run: npm install --prefix functions --omit=dev
      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT repository secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Configure Cloudinary cleanup credentials when available
        shell: bash
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$CLOUDINARY_API_KEY" ] && [ -n "$CLOUDINARY_API_SECRET" ]; then
            umask 077
            printf 'CLOUDINARY_API_KEY=%s\\nCLOUDINARY_API_SECRET=%s\\n' "$CLOUDINARY_API_KEY" "$CLOUDINARY_API_SECRET" > functions/.env
            chmod 600 functions/.env
            echo "Cloudinary cleanup credentials prepared for this deployment."
          else
            echo "::warning::Cloudinary cleanup secrets are not configured; admin media deletion will safely stop instead of silently orphaning files."
          fi
      - name: Deploy Cloud Functions (requires Firebase Blaze plan)
        uses: w9jds/firebase-action@v13.29.0
        with:
          args: deploy --only functions --project maru-ghar-gandhinagar-8dbe4
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

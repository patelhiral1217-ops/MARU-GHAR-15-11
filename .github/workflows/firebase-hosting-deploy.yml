name: Maru Ghar Firebase Hosting Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build hosting files
        run: node copy-web.mjs
      - name: Deploy Hosting only
        uses: w9jds/firebase-action@v13.29.0
        with:
          args: deploy --only hosting --project maru-ghar-gandhinagar-8dbe4
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

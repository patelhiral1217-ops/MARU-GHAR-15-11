name: Maru Ghar Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Run Hosting build and all static/regression checks
        run: npm test
      - name: Report dependency security audit
        shell: bash
        run: |
          npm audit --json > /tmp/root-audit.json || true
          npm audit --prefix functions --json > /tmp/functions-audit.json || true
          node -e "for (const f of ['/tmp/root-audit.json','/tmp/functions-audit.json']) { const j=require(f); console.log(f, JSON.stringify(j.metadata?.vulnerabilities || {})); for (const [name,v] of Object.entries(j.vulnerabilities || {})) console.log(name, v.severity, 'fixAvailable=', JSON.stringify(v.fixAvailable)); }"
      - name: Compile Firestore rules in the Firebase emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project maru-ghar-gandhinagar-8dbe4 "echo Firestore rules compiled successfully"
      - name: Install Functions dependencies and verify package
        run: npm install --prefix functions --ignore-scripts
      - name: Package complete project source
        if: success()
        run: |
          zip -r /tmp/MARU-GHAR-FINAL-SOURCE.zip . -x ".git/*" "node_modules/*" "functions/node_modules/*" ".firebase/*" "MARU-GHAR-FINAL-SOURCE.zip"
          cp /tmp/MARU-GHAR-FINAL-SOURCE.zip ./MARU-GHAR-FINAL-SOURCE.zip
      - name: Upload final project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-FINAL-SOURCE
          path: MARU-GHAR-FINAL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

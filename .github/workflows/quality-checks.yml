name: Maru Ghar Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Run Hosting build and all static/regression checks
        run: npm test
      - name: Compile Firestore rules in the Firebase emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project maru-ghar-gandhinagar-8dbe4 "echo Firestore rules compiled successfully"
      - name: Install Functions dependencies and verify package
        run: npm install --prefix functions --ignore-scripts
      - name: Package complete project source
        if: success()
        run: |
          zip -r /tmp/MARU-GHAR-FINAL-SOURCE.zip . -x ".git/*" "node_modules/*" "functions/node_modules/*" ".firebase/*" "MARU-GHAR-FINAL-SOURCE.zip"
          cp /tmp/MARU-GHAR-FINAL-SOURCE.zip ./MARU-GHAR-FINAL-SOURCE.zip
      - name: Upload final project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MARU-GHAR-FINAL-SOURCE
          path: MARU-GHAR-FINAL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
